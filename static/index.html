<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Tools Hub — AI Workspace Platform</title>

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="/assets/logo-sm.webp" />

  <!-- Google Fonts — không chặn hiển thị: chữ hệ thống hiện ngay, font web thay vào khi tải xong -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

  <!-- Styles -->
  <link rel="stylesheet" href="/styles/theme.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/module.css" />
  <link rel="stylesheet" href="/styles/home.css" />
  <link rel="stylesheet" href="/styles/perf.css" />

  <!-- Tải song song các file lõi thay vì dò từng tầng import -->
  <link rel="modulepreload" href="/js/main.js" />
  <link rel="modulepreload" href="/js/router.js" />
  <link rel="modulepreload" href="/js/moduleRegistry.js" />
  <link rel="modulepreload" href="/stores/authStore.js" />
  <link rel="modulepreload" href="/stores/globalStore.js" />
  <link rel="modulepreload" href="/stores/eventBus.js" />
  <link rel="modulepreload" href="/services/tracker.js" />
  <link rel="modulepreload" href="/services/jobTracker.js" />
  <link rel="modulepreload" href="/layouts/sidebar.js" />
  <link rel="modulepreload" href="/layouts/topNav.js" />
  <link rel="modulepreload" href="/layouts/workspace.js" />
  <link rel="modulepreload" href="/components/toast.js" />
  <link rel="modulepreload" href="/components/icons.js" />
  <link rel="modulepreload" href="/components/statusBadge.js" />
  <link rel="modulepreload" href="/components/pageHero.js" />
  <link rel="modulepreload" href="/modules/catalog/catalogModule.js" />
  <link rel="modulepreload" href="/modules/auth/authModule.js" />
  <script>
    // Máy yếu (ít nhân/RAM) hoặc người dùng muốn giảm chuyển động → tắt hiệu ứng nặng
    (function () {
      var n = navigator, c = n.hardwareConcurrency || 4, m = n.deviceMemory || 8;
      var slow = c <= 4 || m <= 4 || (n.connection && n.connection.saveData) ||
                 (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (slow) document.documentElement.classList.add('lite');
    })();
  </script>
</head>
<body>
  <div class="app-container">
    <div id="sidebarMount"></div>
    <div class="main-wrapper">
      <div id="topNavMount"></div>
      <div id="workspaceMount" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
    </div>
  </div>

  <!-- Single module entry — static imports share singletons correctly -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
