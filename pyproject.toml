[project]
name = "pm-tools-hub"
version = "0.1.0"
description = "PM Tools Hub: bộ công cụ AI (Whisper, VoxCPM, ảnh, báo cáo, pháp luật, CV) chạy trên máy chủ GPU riêng"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
extend-exclude = ["modules/spacet", "node_modules", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E722", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests_hub"]
